name: "Benchmarks"

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      slow:
        description: "Also include slow component cases in the regular job"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  FORCE_COLOR: 1

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changed:
    name: "Check changed files"
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read   # Needed for this check to run on pull requests
    outputs:
      run_benchmarks: ${{ steps.filter.outputs.run_benchmarks }}
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Examine changed files"
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            run_benchmarks:
              - "coverage/**"
              - "**.h"
              - "**.c"
              - "tests/benchmarks/**"
              - ".github/workflows/benchmarks.yml"
              - "requirements/*.txt"
              - "requirements/*.in"
              - "tests/conftest.py"
              - "tests/testenv.py"
              - "tests/test_benchmarks.py"
              - "pyproject.toml"
              - "Makefile"

  benchmarks:
    name: "Run the benchmarks"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: changed
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changed.result == 'success' && needs.changed.outputs.run_benchmarks == 'true'))

    steps:
      - name: "Check out the repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The newest version where sys.monitoring can measure branches, so
          # that all three cores are actually exercised. PYVERSION
          python-version: "3.14"

      - name: "Install dependencies"
        run: |
          set -xe
          python -m pip install -r requirements/pytest.txt
          # An editable install builds the C extension in place. Without it,
          # every ctrace benchmark would silently skip.
          python -m pip install -e .
          python -c "from coverage.core import CTRACER_FILE; assert CTRACER_FILE, 'no CTracer'"

      - name: "Run the benchmarks"
        env:
          # Via the environment, not an inline expansion, so that the value
          # can't be expanded into the script itself.
          SLOW: ${{ inputs.slow }}
        run: |
          if [[ "$SLOW" == "true" ]]; then
            markers="benchmark and not real_project"
          else
            markers="benchmark and not slow"
          fi
          python -m pytest -n0 --benchmarks \
            -m "$markers" \
            tests/benchmarks \
            --benchmark-json=benchmark.json \
            --benchmark-min-rounds=10 --benchmark-max-time=3 \
            --benchmark-columns=min,median,stddev,rounds \
            --benchmark-group-by=group \
            --benchmark-sort=name \
            | tee benchmark.txt

      - name: "Summarize"
        if: always()
        run: |
          if [[ -f benchmark.json ]]; then
            python -m tests.benchmarks.summarize benchmark.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Upload the results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmark.json
          if-no-files-found: error


  extended:
    name: "Real project and memory"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: "Prepare immutable inputs and dependencies"
        run: |
          python -m pip install -r requirements/pytest.txt
          python -m pip install -e .
          python -m tests.benchmarks.real_project prepare
      - name: "Measure extended workloads"
        run: |
          python -m pytest -n0 --benchmarks --bench-real -m "benchmark and slow" \
            tests/benchmarks --benchmark-json=benchmark-extended.json \
            --benchmark-min-rounds=10 --benchmark-max-time=3
      - name: "Summarize"
        if: always()
        run: |
          if [[ -f benchmark-extended.json ]]; then
            python -m tests.benchmarks.summarize benchmark-extended.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-extended-results
          path: benchmark-extended.json
          if-no-files-found: error

  compatibility:
    name: "Benchmark smoke (${{ matrix.python }}, ${{ matrix.os }})"
    needs: changed
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changed.result == 'success' && needs.changed.outputs.run_benchmarks == 'true'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            os: ubuntu-latest
          - python: "3.15"
            os: ubuntu-latest
          - python: "3.14"
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: "Install and validate workloads"
        run: |
          python -m pip install -r requirements/pytest.txt
          python -m pip install -e .
          python -m pytest -n0 --benchmarks --bench-smoke -m "benchmark and not real_project" tests/benchmarks
