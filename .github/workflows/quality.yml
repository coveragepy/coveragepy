name: "Quality"

on:
  push:
    branches:
      - main
      - nedbat/*
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changed:
    name: "Check changed files"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read   # Needed for this check to run on pull requests
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
      actions: ${{ steps.filter.outputs.actions }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: "Examine changed files"
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            python:
              - "**.py"
            docs:
              - "doc/**"
              - "coverage/**.py"
              - "*.rst"
            actions:
              - ".github/workflows/**"
            workflow:
              - ".github/workflows/quality.yml"
              - "tox.ini"
              - "requirements/*.txt"

  lint:
    name: "Pylint etc"
    # Because pylint can report different things on different OS's (!)
    # (https://github.com/PyCQA/pylint/issues/3489), run this on Mac where local
    # pylint gets run.
    runs-on: macos-latest

    needs: changed
    if:
      needs.changed.outputs.python == 'true'
      || needs.changed.outputs.actions == 'true'
      || needs.changed.outputs.workflow == 'true'

    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: "Install Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11" # Minimum of PYVERSIONS
          cache: pip
          cache-dependency-path: 'requirements/*.txt'

      - name: "Install dependencies"
        run: |
          python -m pip install -r requirements/tox.txt

      - name: "Tox lint"
        run: |
          python -m tox -e lint

  mypy:
    name: "Check types"
    runs-on: ubuntu-latest

    needs: changed
    if:
      needs.changed.outputs.python == 'true'
      || needs.changed.outputs.workflow == 'true'

    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: "Install Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11" # Minimum of PYVERSIONS
          cache: pip
          cache-dependency-path: 'requirements/*.txt'

      - name: "Install dependencies"
        run: |
          python -m pip install -r requirements/tox.txt

      - name: "Tox mypy"
        run: |
          python -m tox -e mypy

  doc:
    name: "Build docs"
    runs-on: ubuntu-latest

    needs: changed
    if:
      needs.changed.outputs.docs == 'true'
      || needs.changed.outputs.workflow == 'true'

    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: "Fetch origin/main"
        # rediraffe needs to compare to origin/main
        run: |
          git fetch origin main --depth=1

      - name: "Install Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12" # Doc version from PYVERSIONS
          cache: pip
          cache-dependency-path: 'requirements/*.txt'

      - name: "Show environment"
        run: |
          set -xe
          python -VV
          python -m site
          env | sort

      - name: "Install dependencies"
        run: |
          set -xe
          python -m pip install -r requirements/tox.txt

      - name: "Tox doc"
        run: |
          python -m tox -e doc

  zizmor:
    name: "Zizmor GHA security check"
    runs-on: ubuntu-latest

    needs: changed
    if:
      needs.changed.outputs.actions == 'true'
      || needs.changed.outputs.workflow == 'true'

    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: "Install prek"
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: latest-known
          # Only to run zizmor at the version pinned in .pre-commit-config.yaml.
          install-only: true

      - name: "Run zizmor"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prek exec zizmor -- zizmor --pedantic .github/workflows

      - name: "Verify the actions lockfile"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

  # This job aggregates quality results. It's the required check for branch protection.
  # https://github.com/marketplace/actions/alls-green#why
  # https://github.com/orgs/community/discussions/33579
  success:
    name: "Quality successful"
    needs:
      - changed
      - lint
      - mypy
      - doc
      - zizmor
    # Without this, GitHub skips this job when a needed job doesn't succeed, so
    # the gate reports "skipped" instead of failing.  `allowed-skips` keeps the
    # deliberate skips (no relevant files changed) passing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Decide success or failure"
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, mypy, doc, zizmor
